name: Verify Centerly
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --dart-define=CENTERLY_UI_PREVIEW=true test/ui_preview_navigation_test.dart test/ui_preview_test.dart
      - run: npm ci --prefix supabase/tests
      - run: node supabase/tests/run.mjs
      - run: node supabase/tests/check_manifest.mjs
      - run: node --test supabase/tests/postgres_cluster.test.mjs
      - run: node supabase/tests/concurrency.mjs
      - run: node supabase/tests/session_detail_proposal.mjs
      - run: node supabase/tests/student_profile_proposal.mjs
      - run: node supabase/tests/teacher_completion_package.mjs
      - run: node supabase/tests/subscription_access.mjs
      - run: node supabase/tests/secretary_reactivation.mjs
      - run: node supabase/tests/secretary_deactivation.mjs
      - run: node supabase/tests/completion_integrity.mjs
      - run: node supabase/tests/finance_business.mjs
      - run: node supabase/tests/logic_hardening.mjs
      - run: node supabase/tests/finance_movements.mjs
      - run: node supabase/tests/secretary_operations.mjs
      - run: node supabase/tests/secretary_concurrency.mjs
      - run: node supabase/tests/pilot_recovery.mjs
      - run: node supabase/tests/controlled_pilot.mjs
      - run: node supabase/admin/build_group_pricing_review.mjs --check
      - run: node supabase/tests/group_pricing.mjs
      - run: node supabase/admin/build_finance_edit_review.mjs --check
      - run: node supabase/tests/simple_finance_edit.mjs
      - run: node supabase/tests/required_group_schedule.mjs
      - run: node supabase/tests/multi_day_group.mjs
      - run: node supabase/admin/build_manual_sessions_review.mjs --check
      - run: node supabase/tests/manual_sessions.mjs
      - run: node supabase/tests/direct_attendance.mjs
      - run: node supabase/tests/billing_modes.mjs
      - run: flutter build apk --flavor dev --debug --no-pub
      - run: flutter build apk --flavor dev --profile --no-pub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            build/app/outputs/flutter-apk/app-dev-debug.apk
            build/app/outputs/flutter-apk/app-dev-profile.apk
            docs/screenshots/
